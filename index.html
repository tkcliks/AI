            content: `### 1. Introduction & Definition
Artificial Intelligence (AI) is a multidisciplinary domain of computer science dedicated to creating computational systems capable of performing tasks that typically require biological human intelligence. These tasks encompass visual perception, natural language understanding, logical reasoning, pattern recognition, learning from empirical data, and autonomous decision-making.

### 2. Core Cognitive Objectives of AI
- **Perception:** Extracting meaningful structure from unstructured sensory inputs (images, video streams, audio waveforms, LiDAR scans).
- **Reasoning & Problem Solving:** Synthesizing knowledge structures to evaluate choices, infer logical conclusions, and navigate complex decision trees.
- **Learning & Adaptability:** Updating internal system states or mathematical parameters based on operational feedback or historical data distributions.
- **Natural Language Interaction:** Understanding human linguistic context, semantics, tone, and intent, and generating coherent contextual responses.
- **Autonomous Action:** Executing goal-directed workflows in physical or digital software environments without manual human intervention.

### 3. Narrow Automation vs. True Artificial Intelligence
- **Narrow Automation (Deterministic):** Follows static, hardcoded instructions ($IF-THEN$ rules). It executes repetitive workflows with zero variance and cannot handle unseen scenarios or edge cases.
- **Artificial Intelligence (Probabilistic):** Operates on probabilistic logic and statistical representations. It recognizes nuances, handles noisy real-world inputs, generalizes to unseen situations, and self-improves through exposure to new data.

### 4. Enterprise Value Drivers
1. **Hyper-Personalization:** Tailoring customer recommendations and financial services dynamically at scale.
2. **Operational Efficiency:** Automating high-volume unstructured document extraction (e.g., invoices, claims, legal contracts).
3. **Predictive Analytics:** Forecasting inventory supply bottlenecks, machinery breakdown points, and financial risk indicators before failure occurs.

            content: `### 1. Historical Foundations & The Birth of AI (1950s–1960s)
- **1950 (The Turing Test):** Alan Turing publishes *"Computing Machinery and Intelligence"*, posing the fundamental question: *"Can machines think?"* and introducing the Imitation Game.
- **1956 (The Dartmouth Conference):** John McCarthy, Marvin Minsky, Nathaniel Rochester, and Claude Shannon organize the landmark Dartmouth workshop, officially coining the term *"Artificial Intelligence"*.
- **Early Successes:** The Logic Theorist and General Problem Solver demonstrated symbolic theorem proving, creating early optimism.

### 2. Symbolic Reasoning & The First AI Winter (1970s–1980s)
- **Expert Systems:** Systems like DENDRAL (organic chemistry) and MYCIN (blood infections) encoded domain rules manually into Lisp machines.
- **The First AI Winter (1974–1980):** High computational requirements, combinatorially explosive search spaces, and brittle rule bases caused funding freezes and severe public skepticism.
- **Second AI Winter (1987–1993):** The collapse of the specialized Lisp machine market as commodity desktop microprocessors surpassed specialized hardware.

### 3. The Statistical Revolution & Big Data (1990s–2000s)
- **Shift to Empirical ML:** AI shifted from hand-crafted logic to data-driven statistical models (Support Vector Machines, Random Forests, Naive Bayes).
- **1997 (Deep Blue):** IBM's Deep Blue defeats world chess champion Garry Kasparov using high-speed hardware and specialized search algorithms.
- **Internet Expansion:** The explosion of web data provided the empirical training corpora necessary to scale statistical algorithms.

2. **Artificial General Intelligence (AGI):** Hypothesized AI possessing cross-domain human-level cognitive capabilities—capable of zero-shot learning, abstract reasoning, transfer learning, and autonomous task execution across any intellectual domain.
3. **Artificial Superintelligence (ASI):** Theoretical future AI whose cognitive intellect significantly surpasses the combined brainpower of all human minds across all scientific, creative, and emotional fields.

### 2. Categorization by Functionality (Anekwe / Hinton Framework)
- **Type 1: Reactive Machines:** Has no memory or internal state. Maps immediate inputs directly to output decisions without context from past events (e.g., IBM Deep Blue, basic spam filters).
- **Type 2: Limited Memory Machines:** Maintains temporary short-term historical context to inform decisions (e.g., Autonomous vehicles tracking neighboring car velocities, LLM conversation memory windows).
- **Type 3: Theory of Mind AI:** AI capable of comprehending human emotional states, beliefs, mental motivations, and social interactions (Research & Development frontier).
- **Type 4: Self-Aware AI:** Hypothetical AI possessing self-identity, self-reflection, consciousness, and awareness of its own internal existence.

- **Symbolic AI (Rule Engines):** Explicit logic ($IF-THEN$), expert systems, formal ontologies.
- **Statistical Machine Learning:** Labeled/unlabeled empirical modeling (Random Forests, XGBoost, SVMs).
- **Deep Connectionist AI:** Multi-layered artificial neural networks (CNNs, ResNets, Transformers).
- **Generative & Agentic AI:** Autoregressive foundational models operating with tool execution loops (ReAct, Multi-Agent networks).

        return [{
          id: 1,
          title: 'Module Overview',
          category: 'Overview & Definition',
          body: content.trim()
        }];
      }

      return rawSections.map((raw, idx) => {
        const lines = raw.trim().split('\n');
        const title = lines[0].replace(/^#+\s*/, '').trim();
        const bodyText = lines.slice(1).join('\n').trim();

        let category = 'Core Concept';
        const lowerTitle = title.toLowerCase();
        if (lowerTitle.includes('definition') || lowerTitle.includes('introduction') || lowerTitle.includes('overview') || lowerTitle.includes('role focus')) category = 'Overview & Definition';
        else if (lowerTitle.includes('historical') || lowerTitle.includes('evolution') || lowerTitle.includes('era')) category = 'Historical Milestone';
        else if (lowerTitle.includes('objective') || lowerTitle.includes('capability') || lowerTitle.includes('mechanic') || lowerTitle.includes('paradigm')) category = 'Cognitive Mechanics';
        else if (lowerTitle.includes('use case') || lowerTitle.includes('enterprise') || lowerTitle.includes('comparison') || lowerTitle.includes('application')) category = 'Enterprise Application';
        else if (lowerTitle.includes('stack') || lowerTitle.includes('framework') || lowerTitle.includes('tech') || lowerTitle.includes('tool')) category = 'Tech Stack & Tools';

        return {
          id: idx + 1,
          title: title,
          category: category,
          body: bodyText
        };
      });

            if (trimmed.includes('|') && trimmed.includes('---')) {
              const rows = trimmed.split('\n').filter(r => r.trim().length > 0);
              
              const parseRow = (rStr) => {
                let s = rStr.trim();
                if (s.startsWith('|')) s = s.slice(1);
                if (s.endsWith('|')) s = s.slice(0, -1);
                return s.split('|').map(c => c.trim());
              };

              const headers = rows.length > 0 ? parseRow(rows[0]) : [];
              const bodyRows = rows.length > 2 ? rows.slice(2).map(parseRow) : [];

              return (
                <div key={bIdx} className="my-4 overflow-x-auto rounded-xl border border-slate-800 shadow-xl bg-slate-950/80">

                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6 shadow-xl">
                  <div className="space-y-4 border-b border-slate-800 pb-6">
                    <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider font-mono">Learner Profile</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Full Name</label>
                        <input 
                          type="text" 
                          value={currentUser?.name || ''} 
                          onChange={(e) => setCurrentUser(prev => ({ ...prev, name: e.target.value }))}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Target Specialization Track</label>
                        <select
                          value={currentUser?.role || 'Forward Deployed Engineer (FDE)'}
                          onChange={(e) => setCurrentUser(prev => ({ ...prev, role: e.target.value }))}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Forward Deployed Engineer (FDE)</option>
                          <option>AIOps / MLOps Engineer</option>
                          <option>AI Enterprise Architect</option>
                          <option>AI Strategist & Product Leader</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-4 border-b border-slate-800 pb-6">
                    <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider font-mono">Examination Preferences</h3>
                    
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <div>
                          <p className="text-xs font-semibold text-white">Timer Sound Alerts</p>
                          <p className="text-[11px] text-slate-400 font-normal">Play audio chime when time remaining is low.</p>
                        </div>
                        <input 
                          type="checkbox" 
                          checked={settings.timerSound} 
                          onChange={(e) => setSettings(prev => ({ ...prev, timerSound: e.target.checked }))}
                          className="h-4 w-4 rounded accent-indigo-600"
                        />
                      </div>

                      <div className="flex items-center justify-between">
                        <div>
                          <p className="text-xs font-semibold text-white">Auto-Submit Exam on Timeout</p>
                          <p className="text-[11px] text-slate-400 font-normal">Automatically calculate final score when countdown hits 00:00.</p>
                        </div>
                        <input 
                          type="checkbox" 
                          checked={settings.autoSubmitOnTimeout} 
                          onChange={(e) => setSettings(prev => ({ ...prev, autoSubmitOnTimeout: e.target.checked }))}
                          className="h-4 w-4 rounded accent-indigo-600"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <h3 className="text-xs font-bold text-rose-400 uppercase tracking-wider font-mono">Session Cache Management</h3>
                    <p className="text-xs text-slate-400">Clear local session caches, recorded topic progress, and exam history.</p>
                    <button
                      onClick={() => {
                        localStorage.clear();
                        setUserProgress({ completedTopics: [], passedExams: {}, quizScores: {} });
                        alert('Session cache and user progress successfully reset.');
                      }}
                      className="px-4 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 text-xs font-bold transition-all"
                    >
                      Clear All Cached Progress
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative">
                <button 
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <X className="h-5 w-5" />
                </button>

                <div className="text-center space-y-2">
                  <div className="inline-flex p-3 rounded-2xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 mb-1">
                    <User className="h-6 w-6" />
                  </div>
                  <h3 className="text-xl font-bold text-white">Sign In to Enterprise AI Academy</h3>
                  <p className="text-xs text-slate-400">Authenticate to track phase progress and claim certifications.</p>
                </div>

                <div className="space-y-2">
                  <button
                    onClick={() => handleOAuthLogin('LinkedIn')}
                    className="w-full py-2.5 px-4 rounded-xl bg-[#0A66C2] hover:bg-[#084e96] text-white text-xs font-semibold flex items-center justify-center space-x-2 transition-all"
                  >
                    <Share2 className="h-4 w-4" />
                    <span>Continue with LinkedIn</span>
                  </button>
                  <button
                    onClick={() => handleOAuthLogin('Google')}
                    className="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs font-semibold flex items-center justify-center space-x-2 transition-all"
                  >
                    <Zap className="h-4 w-4 text-amber-400" />
                    <span>Continue with Google Enterprise SSO</span>
                  </button>
                </div>

                <div className="relative flex py-1 items-center">
                  <div className="flex-grow border-t border-slate-800"></div>
                  <span className="flex-shrink mx-3 text-[10px] text-slate-500 uppercase font-mono">Or Email Auth</span>
                  <div className="flex-grow border-t border-slate-800"></div>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Full Name</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Alex Mercer"
                      value={authForm.name}
                      onChange={(e) => setAuthForm(prev => ({ ...prev, name: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Corporate Email</label>
                    <input 
                      type="email"
                      required
                      placeholder="alex.m@company.com"
                      value={authForm.email}
                      onChange={(e) => setAuthForm(prev => ({ ...prev, email: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Select Specialization Track</label>
                    <select
                      value={authForm.role}
                      onChange={(e) => setAuthForm(prev => ({ ...prev, role: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                    >
                      <option>Forward Deployed Engineer (FDE)</option>
                      <option>AIOps / MLOps Engineer</option>
                      <option>AI Enterprise Architect</option>
                      <option>AI Strategist & Product Leader</option>
                    </select>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold transition-all shadow-lg shadow-indigo-600/30"
                  >
                    Complete Registration & Sign In
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-slate-950 py-6 px-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center space-x-2">
                <Zap className="h-4 w-4 text-indigo-400" />
                <span className="font-semibold text-slate-400">Enterprise AI Learning & Assessment Portal</span>
              </div>
              <p>© 2026 Senior AI Consulting Academy. Hosted on GitHub Pages.</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render App to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
